
name: Build PianoBoy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "PianoBoy-UI-Upgrade.zip" ]; then
            ARCHIVE="PianoBoy-UI-Upgrade.zip"
          elif [ -f "PianoBoy-Final-App-Files.zip" ]; then
            ARCHIVE="PianoBoy-Final-App-Files.zip"
          elif [ -f "pianoboy-android-1.zip" ]; then
            ARCHIVE="pianoboy-android-1.zip"
          else
            echo "::error::No PianoBoy source ZIP found in repository root."
            ls -la
            exit 1
          fi

          echo "Extracting: $ARCHIVE"
          mkdir -p extracted
          unzip -o "$ARCHIVE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -n 200

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              ROOT="$DIR"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \)
          )

          if [ -z "$ROOT" ]; then
            echo "::error::Could not find a Gradle Android project."
            find extracted -type f | head -n 300
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Found project at: $ROOT"

      - name: Check launcher icon resources
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.root }}"

          echo "Checking Android manifest and icon resources..."

          find "$PROJECT" -type f \
            \( -name AndroidManifest.xml \
            -o -iname '*ic_launcher*' \
            -o -iname '*pianoboy*icon*' \) \
            -print

          if ! find "$PROJECT" -type f \
            -name AndroidManifest.xml | grep -q .; then
            echo "::error::AndroidManifest.xml was not found."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.root }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Find and validate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find extracted -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            ! -name '*-androidTest.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Build completed without generating an APK."
            find extracted -type f \
              -path '*/build/outputs/*' || true
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::Generated APK is empty."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/PianoBoy.apk

          echo "APK created successfully:"
          ls -lh release/PianoBoy.apk

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging release/PianoBoy.apk
          elif [ -x "$ANDROID_HOME/build-tools/34.0.0/aapt" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/aapt" \
              dump badging release/PianoBoy.apk
          fi

          echo "path=release/PianoBoy.apk" >> "$GITHUB_OUTPUT"

      - name: Upload PianoBoy APK
        uses: actions/upload-artifact@v4
        with:
          name: PianoBoy-APK
          path: release/PianoBoy.apk
          if-no-files-found: error
          retention-days: 14
